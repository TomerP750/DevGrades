version: '3'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - 3000:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - 5173:5173

  postgres:
    image: postgres:15

    ports: 
      - 5432:5432
    

  redis: 
    image: redis:8.8.3-alpine

    ports:
      - 6379:6379


volumes:
  postgres_data:
     

  redis_data:

